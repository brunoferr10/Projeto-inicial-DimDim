<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Arquitetura DimDim no Azure</title><desc id="desc">Task e código no Azure DevOps passam por pull request, CI com testes e Release, que implanta o JAR em App Service conectado a PostgreSQL. O agente executa na VM Ubuntu.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#54718c" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" fill="#f3f7fb"/><style>text{font-family:Arial,sans-serif;fill:#19314d}.label{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#52697e}.edge{fill:none;stroke:#54718c;stroke-width:2;marker-end:url(#arrow)}</style><text x="48" y="48" font-size="27" font-weight="700">DimDim | fluxo de entrega e aplicação em nuvem</text><text x="48" y="77" class="detail">Azure DevOps + App Service + PostgreSQL Flexible Server</text><rect x="48" y="120" width="244" height="126" rx="12" fill="white" stroke="#d1dfeb"/><rect x="48" y="120" width="6" height="126" rx="3" fill="#0b6bd3"/><text x="70" y="152" class="label">Boards + Repos</text><text x="70" y="179" class="detail">Task → branch → PR</text><text x="70" y="202" class="detail">Políticas da main</text><text x="70" y="225" class="detail">Merge aprovado</text><rect x="352" y="120" width="244" height="126" rx="12" fill="white" stroke="#d1dfeb"/><rect x="352" y="120" width="6" height="126" rx="3" fill="#0b6bd3"/><text x="374" y="152" class="label">DimDim-CI</text><text x="374" y="179" class="detail">Compilar e testar</text><text x="374" y="202" class="detail">6 testes JUnit / MockMvc</text><text x="374" y="225" class="detail">Artefato: drop/target/app.jar</text><rect x="656" y="120" width="244" height="126" rx="12" fill="white" stroke="#d1dfeb"/><rect x="656" y="120" width="6" height="126" rx="3" fill="#0b6bd3"/><text x="678" y="152" class="label">DimDim-CD</text><text x="678" y="179" class="detail">Release clássica</text><text x="678" y="202" class="detail">Consome artefato drop</text><text x="678" y="225" class="detail">Deploy com Azure CLI</text><rect x="352" y="301" width="548" height="105" rx="12" fill="white" stroke="#d1dfeb"/><rect x="352" y="301" width="6" height="105" rx="3" fill="#8053bf"/><text x="374" y="333" class="label">VM Ubuntu | DimDimPool</text><text x="374" y="360" class="detail">Agente self-hosted executa as tarefas de CI e Release.</text><text x="374" y="383" class="detail">Java 17 · Maven · Azure CLI · psql</text><rect x="48" y="454" width="244" height="112" rx="12" fill="white" stroke="#d1dfeb"/><rect x="48" y="454" width="6" height="112" rx="3" fill="#0a8a72"/><text x="70" y="486" class="label">Usuário / Postman</text><text x="70" y="513" class="detail">CRUD de clientes</text><text x="70" y="536" class="detail">e pedidos por HTTPS</text><rect x="352" y="454" width="244" height="112" rx="12" fill="white" stroke="#d1dfeb"/><rect x="352" y="454" width="6" height="112" rx="3" fill="#0a8a72"/><text x="374" y="486" class="label">Azure App Service</text><text x="374" y="513" class="detail">API Java Spring Boot</text><text x="374" y="536" class="detail">JAR entregue pelo CI</text><rect x="656" y="454" width="244" height="112" rx="12" fill="white" stroke="#d1dfeb"/><rect x="656" y="454" width="6" height="112" rx="3" fill="#0a8a72"/><text x="678" y="486" class="label">PostgreSQL PaaS</text><text x="678" y="513" class="detail">clientes 1:N pedidos</text><text x="678" y="536" class="detail">JDBC + TLS</text><path d="M292 183 H344" class="edge"/><path d="M596 183 H648" class="edge"/><path d="M474 246 V293" class="edge"/><path d="M778 246 V293" class="edge"/><path d="M900 183 H960 V430 H474 V446" class="edge"/><path d="M292 510 H344" class="edge"/><path d="M596 510 H648" class="edge"/><text x="974" y="345" class="detail">Implantação</text><text x="974" y="367" class="detail">do JAR</text><text x="48" y="600" class="detail">Infraestrutura por Azure CLI · Segredos fora do Git · Evidências CRUD por SELECT no PostgreSQL real</text></svg>